<svg xmlns="http://www.w3.org/2000/svg" width="400" height="634" viewBox="0 0 400 634" role="img" aria-labelledby="title desc" data-background="#0d1117" data-foreground="#f0f6fc">
<title id="title">Verified system runner path</title>
<desc id="desc">Provider setup precedes a read-only probe. Profiling evidence informs a persisted Scheduler decision before an authorized action. Post-action feedback and independent readback complete the check.</desc>
<rect width="400" height="634" rx="12" fill="#0d1117"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8daec9"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#f0f6fc">
<text x="200" y="32" font-size="22" font-weight="700">Verified runner path</text>
<rect x="30" y="60" width="340" height="70" rx="8" fill="#161f2a" stroke="#8daec9" stroke-width="1.5"/>
<text x="200" y="88" font-size="21" font-weight="700">Provider setup</text>
<text x="200" y="113" font-size="18" fill="#b5c8da">Management</text>
<path d="M200 132 V150" fill="none" stroke="#8daec9" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<rect x="30" y="154" width="340" height="70" rx="8" fill="#161f2a" stroke="#8daec9" stroke-width="1.5"/>
<text x="200" y="182" font-size="21" font-weight="700">Read-only probe</text>
<text x="200" y="207" font-size="18" fill="#b5c8da">Logic + Communication</text>
<path d="M200 226 V244" fill="none" stroke="#8daec9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="248" width="340" height="70" rx="8" fill="#161f2a" stroke="#8daec9" stroke-width="1.5"/>
<text x="200" y="276" font-size="21" font-weight="700">Traffic evidence</text>
<text x="200" y="301" font-size="18" fill="#b5c8da">Profiling</text>
<path d="M200 320 V338" fill="none" stroke="#8daec9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="342" width="340" height="70" rx="8" fill="#161f2a" stroke="#8daec9" stroke-width="1.5"/>
<text x="200" y="370" font-size="21" font-weight="700">Persisted decision</text>
<text x="200" y="395" font-size="18" fill="#b5c8da">Scheduler</text>
<path d="M200 414 V432" fill="none" stroke="#8daec9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="436" width="340" height="70" rx="8" fill="#161f2a" stroke="#8daec9" stroke-width="1.5"/>
<text x="200" y="464" font-size="21" font-weight="700">Provider action</text>
<text x="200" y="489" font-size="18" fill="#b5c8da">via Logic + Communication</text>
<path d="M200 508 V526" fill="none" stroke="#8daec9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="530" width="340" height="70" rx="8" fill="#161f2a" stroke="#8daec9" stroke-width="1.5"/>
<text x="200" y="558" font-size="21" font-weight="700">Feedback + readback</text>
<text x="200" y="583" font-size="18" fill="#b5c8da">Post-action verification</text>
</g>
</svg>
